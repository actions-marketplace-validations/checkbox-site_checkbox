# Checkbox GitHub Action: runs `checkbox ci` (npm package @checkbox-site/cli) on every pull request. It checks the files
# listed in checkbox.json (Stripe Checkout params, disclosure text, checkout / pricing pages, lifecycle emails, the
# notice schedule) against automatic-renewal laws, annotates the lines that need a fix and writes a job summary with
# the corrected params / text. Offline by default: no API key, nothing leaves the runner.
#
#   - uses: actions/checkout@v4
#     with:
#       fetch-depth: 0        # the base branch too, so Checkbox can see what a pull request changes
#   - uses: checkbox-site/checkbox@v1
#
# With a shallow checkout, the action fetches the pull request's base branch itself before the checks.
#
# Docs: https://checkbox.site/docs/guides/ci
name: Checkbox compliance checks
description: Check subscription checkouts, disclosures, pages and emails against auto-renewal laws (ROSCA, CA, NY) on every pull request.
author: Checkbox
branding:
  icon: check-square
  color: green

inputs:
  config:
    description: Path to checkbox.json, relative to working-directory.
    required: false
    default: checkbox.json
  strict:
    description: Also fail when a check needs review ("true" or "false").
    required: false
    default: "false"
  working-directory:
    description: Directory to run in (the project root that holds checkbox.json).
    required: false
    default: "."
  args:
    description: More arguments for `checkbox ci`, e.g. "--online" (with the CHECKBOX_SECRET_KEY env) or "--changed-only".
    required: false
    default: ""
  version:
    description: Version of @checkbox-site/cli to run.
    required: false
    # Always a version that is on npm (scripts/public-repos/published-versions.json "published"; the release check
    # fails otherwise). Raise it together with that file, after the new CLI is published (packages/cli/RELEASING.md).
    default: "0.4.12"
  node-version:
    description: Node.js version (22+ runs TypeScript "module" entries without tsx).
    required: false
    default: "22"

outputs:
  status:
    description: pass, fail, needs_review, error or skipped. needs_review fails the job only with --strict or a "strict" entry; read exit-code or result for the outcome.
    value: ${{ steps.checkbox.outputs.status }}
  exit-code:
    description: The exit code of checkbox ci (0 passed; 1 fixes needed; 2 needs review that fails the run, or nothing checked; 3 config error).
    value: ${{ steps.checkbox.outputs.exit_code }}
  result:
    description: The outcome in words, consistent with the exit code (e.g. "passed with items to review (they do not fail this run)").
    value: ${{ steps.checkbox.outputs.result }}
  terms-checked:
    description: true when a Terms of service page ("kind" "terms" in checkbox.json) was checked; false means "Terms NOT checked in CI".
    value: ${{ steps.checkbox.outputs.terms_checked }}
  owner-items:
    description: What only the owner can do, as a Markdown checklist for the pull request description (empty when none).
    value: ${{ steps.checkbox.outputs.owner_items }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - id: checkbox
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECKBOX_CONFIG_FILE: ${{ inputs.config }}
        CHECKBOX_STRICT: ${{ inputs.strict }}
        CHECKBOX_ARGS: ${{ inputs.args }}
        CHECKBOX_CLI_VERSION: ${{ inputs.version }}
      run: |
        # A pull request is compared with its base branch (what it changed and removed, whether it touches a trial,
        # price or interval). A shallow checkout has no origin/<base>: fetch its tip. If that fails, checkbox ci says so.
        if [ -n "${GITHUB_BASE_REF:-}" ] && git rev-parse --is-inside-work-tree >/dev/null 2>&1 \
          && ! git rev-parse --verify --quiet "refs/remotes/origin/${GITHUB_BASE_REF}^{commit}" >/dev/null; then
          git fetch --no-tags --quiet --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" \
            || echo "::warning title=Checkbox::Could not fetch the base branch ${GITHUB_BASE_REF}; use actions/checkout with fetch-depth: 0."
        fi
        args=(ci --config "$CHECKBOX_CONFIG_FILE")
        if [ "$CHECKBOX_STRICT" = "true" ]; then args+=(--strict); fi
        # shellcheck disable=SC2206 # word-splitting the extra arguments is intended
        extra=($CHECKBOX_ARGS)
        npx --yes "@checkbox-site/cli@${CHECKBOX_CLI_VERSION}" "${args[@]}" "${extra[@]}"
