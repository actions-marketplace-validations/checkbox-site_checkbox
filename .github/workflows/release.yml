# Publishes @checkbox-site/node and @checkbox-site/mcp to npm and checkbox-site to PyPI. See RELEASING.md.
#
# npm: the first publish uses the NPM_TOKEN repository secret (a short-lived granular token). Once a trusted publisher
# is configured for each package on npmjs.com (this repository, workflow release.yml), npm >= 11.5 authenticates with
# GitHub's OIDC token instead and NPM_TOKEN can be deleted.
# PyPI: trusted publishing only (environment "pypi"); no token is stored anywhere.
name: Release

on:
  push:
    # Full versions only: the GitHub Action's moving major tag (v1) must not publish the packages.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages carry the tag's version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then node scripts/check-versions.mjs "$GITHUB_REF_NAME"; else node scripts/check-versions.mjs; fi

  npm:
    name: Publish to npm
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Use NPM_TOKEN when the secret is set (first publish only)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: npm ci
      - run: npm run build --workspaces
      - name: Smoke-test the MCP server
        run: node scripts/smoke-mcp.mjs
      - name: Publish (node first, since mcp depends on it)
        run: |
          for ws in node mcp; do
            name=$(node -p "require('./$ws/package.json').name")
            version=$(node -p "require('./$ws/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping."
            else
              npm publish --workspace "$ws"
            fi
          done

  pypi-build:
    name: Build Python distributions
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build python --outdir dist-python
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist-python/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: pypi-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/checkbox-site
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    name: Publish to the official MCP Registry
    needs: npm # the registry checks that the npm package version in server.json exists
    runs-on: ubuntu-latest
    env:
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the registry key is not set
        if: ${{ env.MCP_REGISTRY_PRIVATE_KEY == '' }}
        run: echo "MCP_REGISTRY_PRIVATE_KEY is not set; skipping the registry (see RELEASING.md)."
      - name: Install mcp-publisher
        if: ${{ env.MCP_REGISTRY_PRIVATE_KEY != '' }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Publish server.json (skipped when this server version is already listed)
        if: ${{ env.MCP_REGISTRY_PRIVATE_KEY != '' }}
        run: |
          name=$(node -p "require('./mcp-registry/server.json').name")
          version=$(node -p "require('./mcp-registry/server.json').version")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$name&version=$version" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);process.exit((r.servers||[]).some(x=>x.server&&x.server.version===process.argv[1])?0:1)})" "$version"; then
            echo "$name $version is already in the registry; skipping."
            exit 0
          fi
          ./mcp-publisher login http --domain checkbox.site --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          cd mcp-registry && ../mcp-publisher publish
