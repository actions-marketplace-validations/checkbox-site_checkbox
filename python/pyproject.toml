[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Published to PyPI as checkbox-site ("checkbox" and "checkbox-sdk" belong to unrelated projects); the import name is `checkbox`.
name = "checkbox-site"
version = "0.2.7"
description = "Checkbox: auto-renewal law and subscription compliance checks (FTC ROSCA, California ARL, New York and other state laws) for Stripe Checkout and other subscription checkouts. Official Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Checkbox", email = "support@checkbox.site" }]
keywords = ["subscription", "subscription compliance", "auto-renewal", "automatic renewal", "auto-renewal law", "compliance", "ROSCA", "click to cancel", "FTC", "negative option", "renewal reminder", "stripe", "stripe checkout", "checkout"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://checkbox.site"
Documentation = "https://checkbox.site/docs"
Repository = "https://github.com/checkbox-site/checkbox"
Source = "https://github.com/checkbox-site/checkbox/tree/main/python"
Issues = "https://github.com/checkbox-site/checkbox/issues"

[tool.setuptools]
packages = ["checkbox"]

[tool.setuptools.package-data]
checkbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
